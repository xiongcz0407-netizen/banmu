<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="半亩山居">
<meta name="theme-color" content="#efe7d3">
<!-- 桌面图标（设计12 第五节，开发2 #17）：添加到主屏幕后全屏横屏打开 -->
<link rel="icon" type="image/png" sizes="32x32" href="img/icon/favicon-32.png?v=99ce5e0e">
<link rel="icon" type="image/png" sizes="16x16" href="img/icon/favicon-16.png?v=238353d9">
<link rel="apple-touch-icon" href="img/icon/apple-touch-icon.png?v=0ccc23dd">
<link rel="manifest" href="manifest.json">
<title>半亩山居</title>
<link rel="stylesheet" href="style.css?v=87f8631f">
<style>
/* 加载页（设计12，开发2 #17）：内联在这里，不等 style.css、game.js，1 秒内就能看到 */
#boot{position:fixed;inset:0;z-index:90;overflow:hidden;background:#efe7d3;transition:opacity .6s;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:#3d3226;-webkit-user-select:none;user-select:none}
#boot.out{opacity:0;pointer-events:none}
#bootBg{position:absolute;left:50%;top:50%;width:1376px;height:768px;transform-origin:0 0;background:url(img/boot/加载页背景.webp?v=29357d10) center/100% 100% no-repeat}
#bootSeal{position:absolute;left:978px;top:200px;width:52px;height:82px;background:url(img/boot/印章_归田.png?v=df529f3f) center/100% 100% no-repeat}
#bootLow{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 4%);transform:translateX(-50%);width:min(56vw,560px);padding:8px 18px 10px;border-radius:14px;background:rgba(246,239,222,.75);text-align:center}
#bootTip{min-height:20px;font-size:13px;color:#5a4a34;transition:opacity .5s}
#bootBar{position:relative;height:18px;margin:6px auto 4px;width:100%;border-style:solid;border-color:transparent;border-width:7px 15px;border-image:url(img/ui/进度条.png?v=6294ec62) 14 30 14 30 fill / 7px 15px stretch}
#bootBarI{position:absolute;left:-8px;top:-3px;bottom:-3px;width:0;max-width:calc(100% + 16px);border-radius:6px;background:rgba(70,62,50,.55);transition:width .25s}
#bootTxt{font-size:13px;color:#3d3226;min-height:19px}#bootTxt small{display:block;font-size:11px;color:#7a6a50}
#bootGo{display:none;font-size:17px;font-weight:600;color:#3d3226;padding:6px 0;animation:bootBlink 1.4s ease-in-out infinite}
@keyframes bootBlink{50%{opacity:.35}}
#boot.ready #bootBar,#boot.ready #bootTxt{display:none}#boot.ready #bootGo{display:block}
#bootBtns{display:none;gap:10px;justify-content:center;margin-top:6px}#bootBtns.on{display:flex}
#bootBtns button,#bootLogin button{height:34px;min-width:calc(38px + 2em);padding:0 6px;border-style:solid;border-color:transparent;border-width:10px 15px;border-image:url(img/ui/按钮_裱_绿.png?v=e62d5ff7) 40 64 fill / 10px 15px stretch;background:none;border-radius:0;color:#4a3826;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}
#bootBtns button.g,#bootLogin button.g{border-image-source:url(img/ui/按钮_裱_米.png?v=eb4e0aa8)}
#bootBtns button:active,#bootLogin button:active{border-image-source:url(img/ui/按钮_裱_按下.png?v=0b01fe18);transform:translateY(1px)}
#bootBtns button:disabled,#bootLogin button:disabled{filter:grayscale(.8) opacity(.6)}
#bootVer{position:absolute;right:calc(env(safe-area-inset-right,0px) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 6px);font-size:11px;color:rgba(60,50,38,.55)}
#bootLogin{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,86vw);max-height:92vh;overflow:auto;padding:4px 18px 8px;border-style:solid;border-color:transparent;border-width:20px 25px;border-image:url(img/ui/卷轴大面板.png?v=58442469) 40 50 40 50 fill / 20px 25px stretch;text-align:center;font-size:14px}
#bootLogin.on{display:block}#bootLogin h4{margin:0 0 8px;font-size:17px;letter-spacing:2px}
#bootLogin label{display:flex;align-items:center;gap:8px;margin:6px 0;text-align:left}#bootLogin label span{width:4.5em;flex:none;color:#5a4a34}
#bootLogin input{flex:1;min-width:0;height:32px;padding:0 8px;border:1px solid #b59a6a;border-radius:8px;background:#fffaf0;font:15px inherit;font-family:inherit;color:#3d3226;-webkit-user-select:text;user-select:text}
#bootLogin input:focus,#bootLogin input:focus-visible{outline:none;border-color:#a87a3e;box-shadow:0 0 0 2px rgba(168,122,62,.22)}/* #26 ⑤：选中的框（名字、口令都一样）金棕色细边，去掉浏览器默认的黑色粗框 */
#bootLogin .msg{min-height:18px;font-size:12px;color:#b04a2a;margin:4px 0}#bootLogin .msg.ok{color:#2f6a3e}
#bootLogin .note{font-size:11px;color:#7a6a50;margin:6px 0 0}
</style>

</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="ui"></div>
</div>
<div id="boot">
  <div id="bootBg"><div id="bootSeal"></div></div>
  <div id="bootLow">
    <div id="bootTip"></div>
    <div id="bootBar"><i id="bootBarI"></i></div>
    <div id="bootTxt">正在打开…</div>
    <div id="bootGo">点一下，回到半亩山居</div>
    <div id="bootBtns"><button id="bootRetry">再试一次</button><button id="bootSkip" class="g">先进游戏</button></div>
  </div>
  <div id="bootLogin"></div>
  <div id="bootVer">V0.67</div>
</div>
<script>
/* 背景按短边等比放大、居中裁（印章跟着图一起缩放，盖在原来「居居」那个印上） */
(function(){function f(){var e=document.getElementById('bootBg');if(!e)return;var k=Math.max(innerWidth/1376,innerHeight/768);e.style.transform='scale('+k+') translate(-50%,-50%)'}f();addEventListener('resize',f)})();
</script>
<div id="rotate"><div><b>请把手机横过来</b><small>半亩山居是横屏游戏</small></div></div>
<script src="game.js?v=318fd324"></script>
</body>
</html>
